<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Visualización 3D - Teatro Tecal</title>
    <meta name="description" content="Tecal — Simulación de teatros e iluminación escénica. IDE web tipo WYSIWYG CAD para visualización 3D de espacios teatrales.">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- CSS Modules -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/properties.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/context-menu.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/watermark.css">

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <!-- ============================================================
         LOADER — renderizado por CSS desde el primer byte
    ============================================================ -->
    <div id="tecal-loader">
        <div class="loader-brand">
            <div class="loader-brand-title">Teatro Tecal</div>
            <div class="loader-brand-sub">Plano Estructural 3D</div>
        </div>

        <div class="loader-steps" id="loader-steps">
            <!-- Steps se insertan por JS, pero el contenedor existe desde HTML -->
        </div>

        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loader-bar"></div>
        </div>

        <div class="loader-status" id="loader-status">Inicializando…</div>
    </div>

    <!-- ============================================================
         APP SHELL — oculto hasta que el loader termina
    ============================================================ -->
    <div id="app-shell" class="app-loading">
        <div id="app-title">TEATRO TECAL 3D — PLANO ESTRUCTURAL</div>

        <div id="top-bar">

            <!-- GRUPO 1: Menú + toggle 2D/3D -->
            <div class="tb-group">
                <button id="btn-top-explorer" class="icon-btn" title="Explorador"><i class="ph ph-tree-structure"></i></button>
                <button id="btn-top-properties" class="icon-btn" title="Propiedades"><i class="ph ph-sliders"></i></button>
                <div class="tb-sep"></div>
                <button id="btn-toggle-view" class="icon-btn active" title="Alternar 2D/3D"><i class="ph ph-cube"></i></button>
            </div>

            <div class="tb-sep"></div>

            <!-- GRUPO 2: Visibilidad de escena -->
            <div class="tb-group">
                <button id="btn-dimensions" class="icon-btn" title="Mostrar/Ocultar Acotaciones"><i class="ph ph-ruler"></i></button>
                <button id="btn-grid" class="icon-btn" title="Ajustes de Grid"><i class="ph ph-grid-four"></i></button>
                <button id="btn-wireframe" class="icon-btn" title="Wire View"><i class="ph ph-bounding-box"></i></button>
                <button id="btn-gizmo" class="icon-btn active" title="Mostrar/Ocultar Gizmo"><i class="ph ph-compass"></i></button>
            </div>

            <div class="tb-sep"></div>

            <!-- GRUPO 3: Herramientas -->
            <div class="tb-group">
                <button id="btn-select" class="icon-btn" title="Seleccionar (Q)"><i class="ph ph-cursor"></i></button>
                <button id="btn-move" class="icon-btn" title="Mover (W)"><i class="ph ph-arrows-out-cardinal"></i></button>
                <button id="btn-rotate" class="icon-btn" title="Rotar (R)"><i class="ph ph-arrows-clockwise"></i></button>
                <div id="move-planes">
                    <button class="icon-btn sm btn-plane active" data-plane="xz"
                        title="Mover en plano horizontal XZ">XZ</button>
                    <button class="icon-btn sm btn-plane" data-plane="xy" title="Mover en plano frontal XY">XY</button>
                    <button class="icon-btn sm btn-plane" data-plane="yz" title="Mover en plano lateral YZ">YZ</button>
                </div>
                <div class="tb-sep" style="margin: 0 4px; display: inline-block; vertical-align: middle;"></div>
                <button id="btn-zoom-toggle" class="icon-btn sm active" title="Zoom hacia el cursor (CAD)"><i class="ph ph-cursor-click"></i></button>
                <button id="btn-clamp" class="icon-btn sm active" title="Restringir al área del teatro"><i class="ph ph-arrows-in"></i></button>
                <button id="btn-orbit" class="icon-btn active" title="Órbita / Navegar (E)"><i class="ph ph-globe-hemisphere-east"></i></button>
                <button id="btn-pan" class="icon-btn" title="Encuadre / Pan (H)"><i class="ph ph-hand"></i></button>
            </div>

            <!-- GRUPO 4: Historial + Brillo -->
            <div class="tb-group tb-group-right">
                <button id="btn-undo" class="icon-btn disabled" title="Deshacer (Ctrl+Z)"><i class="ph ph-arrow-u-up-left"></i></button>
                <button id="btn-redo" class="icon-btn disabled" title="Rehacer (Ctrl+Y)"><i class="ph ph-arrow-u-up-right"></i></button>
                <div class="tb-sep"></div>
                <button id="btn-brightness" class="icon-btn" title="Luz Ambiente"><i class="ph ph-sun"></i></button>
            </div>

        </div>

        <div id="toolbar-2d">
            <button class="icon-btn sm btn-cam-mode" data-mode="top" title="Superior"><i class="ph ph-arrow-line-down"></i></button>
            <button class="icon-btn sm btn-cam-mode" data-mode="front" title="Frontal"><i class="ph ph-align-center-horizontal"></i></button>
            <button class="icon-btn sm btn-cam-mode" data-mode="bottom" title="Inferior"><i class="ph ph-arrow-line-up"></i></button>
            <button class="icon-btn sm btn-cam-mode" data-mode="left" title="Lateral Izquierda"><i class="ph ph-arrow-line-right"></i></button>
            <button class="icon-btn sm btn-cam-mode" data-mode="right" title="Lateral Derecha"><i class="ph ph-arrow-line-left"></i></button>
            <button class="icon-btn sm btn-cam-mode" data-mode="ortho" title="Ortogonal"><i class="ph ph-selection-all"></i></button>
            <div class="separator"></div>
            <button class="icon-btn sm btn-cam-mode" data-mode="split" title="Vista Dividida"><i class="ph ph-squares-four"></i></button>
            <div class="separator"></div>
            <button class="icon-btn sm btn-fit-view" id="btn-fit-view" title="Encuadrar Vista (Fit)"><i class="ph ph-frame-corners"></i></button>
        </div>

        <div id="main-wrapper">
            <div id="activity-bar">
                <button id="btn-act-explorer" class="act-btn" title="Explorador"><i class="ph ph-tree-structure"></i></button>
                <button id="btn-act-properties" class="act-btn" title="Propiedades"><i class="ph ph-sliders"></i></button>
            </div>
            
            <div id="canvas-wrapper" class="tool-orbit single-active">
                <canvas id="ruler-overlay"></canvas>
                <div class="split-divider v"></div>
                <div class="split-divider h"></div>
                <div class="split-badge tl"><i class="ph ph-arrow-line-down"></i> Superior</div>
                <div class="split-badge tr"><i class="ph ph-align-center-horizontal"></i> Frontal</div>
                <div class="split-badge bl"><i class="ph ph-arrow-line-right"></i> Lateral</div>
                <div class="split-badge br"><i class="ph ph-selection-all"></i> Ortogonal</div>
                <div class="single-badge tl" id="single-badge"><i class="ph ph-cube"></i> <span>Perspectiva (3D)</span></div>
                
                <div id="gizmo-container" title="Arrastrar Gizmo"></div>
                
                <!-- Loading Overlay for 3D assets -->
                <div id="canvas-loading-overlay" style="display: none;">
                    <div class="cube-spinner"></div>
                </div>
            </div>

            <div id="sidebar">
                <!-- SELECTOR DE CONTEXTO (2 Filas de Pestañas) -->
                <div class="sidebar-tab-grid">
                    <div class="sidebar-tab-row">
                        <button onclick="window._switchCategory('arquitectura')" id="tab-arquitectura" class="tab-btn">
                            Espacio Arquitectónico
                        </button>
                        <button onclick="window._switchCategory('escena')" id="tab-escena" class="tab-btn">
                            Espacio Escénico
                        </button>
                    </div>
                    <div class="sidebar-tab-row">
                        <button onclick="window._switchCategory('iluminacion')" id="tab-iluminacion" class="tab-btn">
                            Iluminación y Medios
                        </button>
                        <button onclick="window._switchCategory('personas')" id="tab-personas" class="tab-btn">
                            Personas
                        </button>
                    </div>
                </div>

                <!-- Contenedor ÚNICO del Árbol de Nodos -->
                <div class="tree-scroll-area" id="tree-container">
                    <!-- Contenido inyectado por renderTree() vía JS -->
                </div>
            </div>

            <div id="brightness-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <label style="margin: 0;">Intensidad Luz Ambiente</label>
                    <button id="btn-close-brightness" class="icon-btn sm" style="margin-left: 10px;"><i class="ph ph-x"></i></button>
                </div>
                <input type="range" id="brightness-slider" min="0" max="1" step="0.01" value="1">
            </div>

            <div id="properties-panel" class="collapsed">
                <div class="sidebar-tabs" id="prop-desktop-header">
                    <button class="tab-btn active">Propiedades</button>
                </div>
                <div id="prop-header">
                    <span id="prop-title-path">Contenedor</span>
                    <span id="desktop-prop-title">Propiedades</span>
                    <i class="ph ph-caret-down panel-toggle-icon"></i>
                </div>
                <div id="prop-content"></div>
            </div>
        </div>

        <div id="watermark">
            <div class="wm-title">Teatro Tecal</div>
            <div class="wm-author">By Leonardo Merchán</div>
            <a href="https://instagram.com/_ledirec" target="_blank" class="wm-link">@_ledirec</a>
        </div>

        <div id="bottom-bar">
            <div class="status-item" id="status-coords"><i class="ph ph-ruler"></i> <span>8m (W) x 4.5m (H) x 7.5m (D)</span></div>
            <div class="status-item" id="status-rotation"><i class="ph ph-arrows-clockwise"></i> <span>0.0° / 0.0° / 0.0°</span></div>
            <div class="status-item"><i class="ph ph-camera"></i> <span id="status-cam">Perspectiva (3D)</span></div>
        </div>
    </div><!-- #app-shell -->

    <!-- Floating DEV button: Clear localStorage + cache + reload -->
    <button id="btn-clear-all" title="DEV: Limpiar cache + localStorage + reload"
        style="position:fixed; top:8px; right:8px; z-index:99999; background:rgba(30,30,30,0.9); border:1px solid #ff6b6b; color:#ff6b6b; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; display:flex; align-items:center; gap:5px; backdrop-filter:blur(4px); transition: background 0.2s, transform 0.1s;"
        onmouseover="this.style.background='rgba(255,107,107,0.2)'; this.style.transform='scale(1.05)';"
        onmouseout="this.style.background='rgba(30,30,30,0.9)'; this.style.transform='scale(1)';">
        <i class="ph ph-trash" style="font-size:14px;"></i>
        <span>Clear</span>
    </button>

    <!-- Floating crosshair hint near cursor -->
    <div id="cursor-move-hint">
        <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="7" y1="1" x2="7" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="7" y1="9" x2="7" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="1" y1="7" x2="5" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="9" y1="7" x2="13" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Entry Point -->
    <script type="module" src="js/main.js"></script>

</body>

</html>
